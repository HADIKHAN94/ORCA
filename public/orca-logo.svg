<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="orcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0077B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48CAE4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096C7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle border -->
  <circle cx="100" cy="90" r="75" stroke="url(#orcaGrad)" stroke-width="2.5" fill="white"/>

  <!-- Orca whale body - main shape -->
  <path d="M 55 115 C 45 90 50 60 75 45 C 90 37 108 38 120 48 C 135 60 140 78 133 95 C 126 112 110 120 93 122 C 78 124 65 120 55 115 Z" fill="url(#bodyGrad)"/>

  <!-- Orca head/snout -->
  <path d="M 118 48 C 128 52 138 62 142 75 C 146 88 142 100 135 108 C 145 95 147 78 140 65 C 135 55 128 49 118 48 Z" fill="#48CAE4" opacity="0.6"/>

  <!-- Orca eye -->
  <ellipse cx="122" cy="60" rx="6" ry="7" fill="white"/>
  <ellipse cx="123" cy="61" rx="3.5" ry="4" fill="#0A192F"/>
  <circle cx="124" cy="60" r="1" fill="white"/>

  <!-- White saddle patch -->
  <path d="M 95 70 C 105 65 118 68 124 78 C 120 72 110 70 100 73 Z" fill="white" opacity="0.9"/>

  <!-- Dorsal fin -->
  <path d="M 88 45 C 92 28 100 22 105 35 C 100 32 96 38 95 45 Z" fill="url(#bodyGrad)"/>

  <!-- Tail fin -->
  <path d="M 55 115 C 48 120 38 128 42 135 C 46 128 55 122 62 118 Z" fill="#0A192F"/>
  <path d="M 55 115 C 50 125 45 138 52 142 C 52 133 56 124 62 118 Z" fill="#0077B6"/>

  <!-- Circuit board lines on body -->
  <g stroke="#48CAE4" stroke-width="1.2" opacity="0.8">
    <!-- Horizontal lines -->
    <line x1="68" y1="75" x2="95" y2="68"/>
    <line x1="65" y1="88" x2="100" y2="82"/>
    <line x1="68" y1="100" x2="95" y2="97"/>

    <!-- Vertical connector lines -->
    <line x1="78" y1="75" x2="78" y2="88"/>
    <line x1="88" y1="68" x2="88" y2="82"/>
    <line x1="75" y1="88" x2="75" y2="100"/>
    <line x1="90" y1="82" x2="90" y2="97"/>

    <!-- Circuit nodes (dots) -->
    <circle cx="78" cy="75" r="2" fill="#48CAE4"/>
    <circle cx="88" cy="68" r="2" fill="#48CAE4"/>
    <circle cx="78" cy="88" r="2" fill="#48CAE4"/>
    <circle cx="88" cy="82" r="2" fill="#48CAE4"/>
    <circle cx="75" cy="100" r="2" fill="#48CAE4"/>
    <circle cx="90" cy="97" r="2" fill="#48CAE4"/>
  </g>

  <!-- Circuit lines extending outside body (upper area) -->
  <g stroke="#0096C7" stroke-width="1" opacity="0.7">
    <line x1="88" y1="40" x2="88" y2="28"/>
    <line x1="88" y1="28" x2="78" y2="28"/>
    <line x1="78" y1="28" x2="78" y2="20"/>
    <circle cx="78" cy="28" r="2" fill="#0096C7"/>
    <circle cx="78" cy="20" r="2" fill="#48CAE4"/>

    <line x1="105" y1="35" x2="115" y2="25"/>
    <line x1="115" y1="25" x2="125" y2="25"/>
    <circle cx="115" cy="25" r="2" fill="#0096C7"/>
    <circle cx="125" cy="25" r="2" fill="#48CAE4"/>
  </g>

  <!-- Circuit lines extending outside body (lower area) -->
  <g stroke="#0096C7" stroke-width="1" opacity="0.7">
    <line x1="90" y1="120" x2="90" y2="135"/>
    <line x1="90" y1="135" x2="110" y2="135"/>
    <line x1="110" y1="135" x2="120" y2="128"/>
    <circle cx="90" cy="135" r="2" fill="#0096C7"/>
    <circle cx="110" cy="135" r="2" fill="#0096C7"/>
    <circle cx="120" cy="128" r="2" fill="#48CAE4"/>

    <line x1="120" y1="110" x2="138" y2="118"/>
    <line x1="138" y1="118" x2="148" y2="118"/>
    <circle cx="138" cy="118" r="2" fill="#0096C7"/>
    <circle cx="148" cy="118" r="2" fill="#48CAE4"/>
  </g>

  <!-- Text: ORCA -->
  <text x="100" y="183" font-family="'Arial', sans-serif" font-size="26" font-weight="900" fill="#0A192F" text-anchor="middle" letter-spacing="3">ORCA</text>

  <!-- Text: MARINE INTELLIGENCE PLATFORM -->
  <text x="100" y="197" font-family="'Arial', sans-serif" font-size="7.5" font-weight="600" fill="#0077B6" text-anchor="middle" letter-spacing="1.5">MARINE INTELLIGENCE PLATFORM</text>
</svg>
